services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gpr
      POSTGRES_PASSWORD: gpr
      POSTGRES_DB: gpr
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gpr']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  mailpit:
    # Capture les emails OTP en dev : interface web sur http://localhost:8025
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
