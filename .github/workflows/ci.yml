# Intégration continue : à chaque push et pull request, tout est vérifié
# (types, tests unitaires et d'intégration avec une vraie base, build des apps et des images Docker).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gpr
          POSTGRES_PASSWORD: gpr
          POSTGRES_DB: gpr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gpr" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://gpr:gpr@localhost:5432/gpr_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configuration de test (secrets éphémères, propres à ce job)
        run: |
          gen() { node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"; }
          key=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          sed -e "s|^DATABASE_URL=.*|DATABASE_URL=$DATABASE_URL|" \
              -e "s|^NODE_ENV=.*|NODE_ENV=test|" \
              -e "s|^JOBS_ENABLED=.*|JOBS_ENABLED=false|" \
              -e "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(gen)|" \
              -e "s|^OTP_PEPPER=.*|OTP_PEPPER=$(gen)|" \
              -e "s|^CONNECTOR_ENCRYPTION_KEY=.*|CONNECTOR_ENCRYPTION_KEY=$key|" \
              .env.example > apps/api/.env.test
          cp apps/api/.env.test apps/api/.env
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @gpr/admin build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image back-office
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image app web (préproduction)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mobile/Dockerfile.web
          push: false
          build-args: EXPO_PUBLIC_API_URL=https://api.preprod.gpr-padel.fr
          cache-from: type=gha
          cache-to: type=gha,mode=max
