# Déploiement GPR sur un serveur (préproduction ou production).
#   cp deploy/env.example deploy/.env   # puis renseigner les valeurs
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm api npx prisma migrate deploy
#
# Base de données : une base PostgreSQL MANAGÉE (sauvegardes automatiques) est recommandée ;
# renseigner alors DATABASE_URL et supprimer le service « postgres » ci-dessous.
name: gpr-${GPR_ENV:-production}

services:
  caddy:
    # Reverse proxy avec certificats HTTPS automatiques (Let's Encrypt)
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${GPR_STATE_DIR:-.}/sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, admin]

  api:
    build:
      {
        context: ..,
        dockerfile: apps/api/Dockerfile,
        args: { NODE_IMAGE: '${NODE_IMAGE:-node:22-bookworm-slim}' },
      }
    restart: unless-stopped
    env_file: ${GPR_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      TRUST_PROXY: '1'
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_started }

  admin:
    build:
      {
        context: ..,
        dockerfile: apps/admin/Dockerfile,
        args: { NODE_IMAGE: '${NODE_IMAGE:-node:22-bookworm-slim}' },
      }
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    depends_on: [api]

  webapp:
    # Version web de l'app joueur (préproduction) : https://APP_DOMAIN
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile.web
      args:
        NODE_IMAGE: '${NODE_IMAGE:-node:22-bookworm-slim}'
        EXPO_PUBLIC_API_URL: 'https://${API_DOMAIN}'
    restart: unless-stopped
    profiles: ['webapp']

  redis:
    # File des tâches planifiées (synchronisations, expirations…) ; persistance AOF
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis_data:/data]

  postgres:
    # À supprimer si vous utilisez une base managée (recommandé)
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis}
      POSTGRES_DB: gpr
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gpr']
      interval: 10s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  pg_data:
